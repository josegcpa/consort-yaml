[project]
name = "consort_yaml"
version = "0.1.0"
description = "Generate a CONSORT flowchart from YAML."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/consort_yaml"]