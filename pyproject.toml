[project]
name = "consort_yaml"
version = "0.1.0"
description = "Generate a CONSORT flowchart from YAML."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pre-commit>=4.6.1",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "black>=24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/consort_yaml"]

[project.scripts]
consort-yaml = "consort_yaml.__main__:main"

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.black]
line-length = 80
target-version = ["py311"]
